<style>
  :root{
    --panel: rgba(16,20,26,.72);
    --panel-brd: rgba(255,255,255,.10);
    --txt: #e9e4da;
    --txt-dim: #a9a294;
    --accent: #e8b06a;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; background:#0e1216; }
  body{ font-family: system-ui, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif; color:var(--txt); }
  canvas{ display:block; touch-action:none; }
  #app{ position:fixed; inset:0; }

  /* ---------- HUD ---------- */
  .card{
    position:fixed; z-index:10; background:var(--panel);
    -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2);
    border:1px solid var(--panel-brd); border-radius:14px;
    box-shadow: 0 12px 34px rgba(0,0,0,.45);
  }
  #title{ top:14px; left:14px; padding:10px 14px 9px; }
  #title h1{ font-size:14px; font-weight:650; letter-spacing:.04em; }
  #title p{ font-size:11px; color:var(--txt-dim); margin-top:2px; letter-spacing:.03em; }
  #title .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--accent); margin-right:6px; vertical-align:1px; box-shadow:0 0 8px var(--accent); }

  #hint{ top:14px; right:14px; padding:8px 12px; font-size:11px; color:var(--txt-dim); line-height:1.7; text-align:right; }
  #hint b{ color:var(--txt); font-weight:600; }

  #panel{ left:14px; bottom:14px; padding:10px; display:flex; flex-direction:column; gap:8px; max-width:min(92vw, 560px); }
  .row{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .row .lab{ font-size:10px; color:var(--txt-dim); letter-spacing:.12em; text-transform:uppercase; width:44px; flex:none; }
  button.chip{
    appearance:none; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.05);
    color:var(--txt); border-radius:9px; padding:6px 11px; font-size:12px; cursor:pointer;
    transition: background .18s, border-color .18s, color .18s, transform .05s;
    font-family:inherit; letter-spacing:.02em; white-space:nowrap;
  }
  button.chip:hover{ background:rgba(255,255,255,.11); }
  button.chip:active{ transform:translateY(1px); }
  button.chip.on{ background:linear-gradient(180deg, rgba(232,176,106,.28), rgba(232,176,106,.16)); border-color:rgba(232,176,106,.55); color:#ffd9a0; }
  .sep{ width:1px; height:18px; background:rgba(255,255,255,.12); margin:0 2px; }

  /* ---------- loader ---------- */
  #loader{
    position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; gap:14px;
    align-items:center; justify-content:center; background:#0e1216;
    transition: opacity .7s ease; 
  }
  #loader.hide{ opacity:0; pointer-events:none; }
  #loader .ring{ width:34px; height:34px; border-radius:50%; border:2px solid rgba(255,255,255,.12); border-top-color:var(--accent); animation:spin 1s linear infinite; }
  #loader p{ font-size:12px; color:var(--txt-dim); letter-spacing:.14em; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  @media (max-width:640px){
    #hint{ display:none; }
    .row .lab{ width:auto; }
    #panel{ left:10px; right:10px; bottom:10px; max-width:none; }
    button.chip{ padding:6px 9px; font-size:11px; }
  }
</style>

<body>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* =====================================================================
   room3D — 客飯廳 (Living & Dining room)
   A Hong Kong family flat, 2房1廳 · living room ≈ 4.25 m × 2.60 m
   Everything below is procedural geometry. No texture maps, no models.

   Layout is taken from the reference sketch (images/tv_cabinet.jpg) and the
   site photos. The NORTH wall is the 電視牆 (TV wall):

     廚房門 │ 中空櫃 │  電視櫃 = 白色飾牆 + 冷氣窗(窗口式冷氣) + 電視  │ 廁門貨架 │ 廁所門
     0.70m    0.50m              1.95m (云石窗台 ≈ 2 m)               0.40m      0.70m

   The SOUTH wall carries the main window (≈ 3 m, 云石窗台) — the sofa sits
   with its back to it, facing the TV wall. The entrance door is on the EAST
   wall. There is no coffee table and no ceiling fan.
   ===================================================================== */

/* ---------- seeded pseudo-random (reproducible detail) ---------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rnd = mulberry32(20260922);
const rr = (a,b)=> a + (b-a)*rnd();

/* ---------- room constants ---------- */
const L = 4.25, D = 2.60, H = 2.62, T = 0.12;
const X0 = -L/2, X1 = L/2, Z0 = -D/2, Z1 = D/2;
const FL = 0.015;                       // top of parquet
const DEG = Math.PI/180;

/* ---------- TV wall (north) — west ➜ east, derived from the sketch ---------- */
const KD0 = X0,        KD1 = KD0 + 0.70;      // 廚房門      kitchen doorway
const TC0 = KD1,       TC1 = TC0 + 0.50;      // 中空櫃      tall display cabinet
const TV0 = TC1,       TV1 = TV0 + 1.95;      // 電視櫃 run  (白牆 + 冷氣窗 + 電視 + 長櫃)
const SB0 = TV1,       SB1 = SB0 + 0.40;      // 廁門貨架    open book shelf
const TD0 = SB1,       TD1 = X1;              // 廁所門      toilet doorway
const TVC     = (TV0 + TV1) / 2;              // centre line of the TV composition
const ACW     = 1.30;                         // 冷氣窗 opening width
const ACY0    = 1.88, ACY1 = 2.36;            // 冷氣窗 opening (height band)
const CON_Y1  = 0.74, CON_Y2 = 0.42;          // TV-cabinet shelf levels
const CON_D   = 0.42;                         // TV-cabinet depth
const MARBLE  = 0.034;                        // 云石 slab thickness

/* ---------- main window (south wall) — ≈ 3 m of 云石窗台 ---------- */
const WIN_X0 = -1.50, WIN_X1 = 1.50, WIN_Y0 = 0.86, WIN_Y1 = 2.26;

/* ---------- main door (east wall) ---------- */
const ED0 = -1.05, ED1 = -0.17;

/* ---------- renderer / scene / camera ---------- */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.04;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xdde8f0, 26, 88);

const camera = new THREE.PerspectiveCamera(58, window.innerWidth/window.innerHeight, 0.05, 220);
camera.position.set(1.55, 1.62, -0.62);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.90, 0.90, 0.35);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 0.7;
controls.maxDistance = 4.8;
controls.maxPolarAngle = 1.545;
controls.screenSpacePanning = false;
controls.update();

/* soft procedural environment (for metals / glass reflections) */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.34;
pmrem.dispose();

/* ---------- material palette ---------- */
const std  = o => new THREE.MeshStandardMaterial(o);
const phys = o => new THREE.MeshPhysicalMaterial(o);

const M = {
  paint      : std({ color:0xf2eee6, roughness:0.96 }),
  ceil       : std({ color:0xf8f7f4, roughness:0.97 }),
  skirt      : std({ color:0xfbfaf7, roughness:0.65 }),
  oak        : std({ color:0xc7a066, roughness:0.62 }),
  oakPale    : std({ color:0xd8bb8b, roughness:0.6 }),
  walnut     : std({ color:0x4b3627, roughness:0.5 }),
  white      : std({ color:0xf6f5f2, roughness:0.5 }),
  whiteGloss : std({ color:0xf9f9f7, roughness:0.22 }),
  whiteSatin : std({ color:0xf3f2ee, roughness:0.42 }),
  steel      : std({ color:0xccd1d5, roughness:0.3, metalness:0.9 }),
  steelDark  : std({ color:0x8f979e, roughness:0.35, metalness:0.85 }),
  alu        : std({ color:0xb9bfc6, roughness:0.42, metalness:0.8 }),
  black      : std({ color:0x1b1b1e, roughness:0.6 }),
  matteGray  : std({ color:0x55504a, roughness:0.9 }),
  brass      : std({ color:0xb08d57, roughness:0.35, metalness:0.95 }),
  leather    : phys({ color:0xe8dfcc, roughness:0.55, clearcoat:0.22, clearcoatRoughness:0.55 }),
  cushionCrm : std({ color:0xded2bc, roughness:0.95 }),
  cushionSage: std({ color:0x9aa88a, roughness:0.95 }),
  cushionTrra: std({ color:0xc97a54, roughness:0.95 }),
  fabricChrc : std({ color:0x4d4a46, roughness:1.0 }),
  linen      : std({ color:0xf0e6d2, roughness:0.95, emissive:0xffdfae, emissiveIntensity:0.0 }),
  rugBase    : std({ color:0xd9cdb4, roughness:1.0 }),
  rugBand    : std({ color:0xa9743f, roughness:1.0 }),
  terracotta : std({ color:0xb96a44, roughness:0.85 }),
  ceramic    : std({ color:0xeee9df, roughness:0.35 }),
  concrete   : std({ color:0xb4b0a8, roughness:0.95 }),
  tileLight  : std({ color:0xd3d5d4, roughness:0.4 }),
  tileBath   : std({ color:0xdfe1e0, roughness:0.35 }),
  bathWall   : std({ color:0xf2f4f4, roughness:0.25 }),
  leafA      : std({ color:0x3f6b3f, roughness:0.85 }),
  leafB      : std({ color:0x4d7a45, roughness:0.85, flatShading:true }),
  leafC      : std({ color:0x5d8a4e, roughness:0.85, flatShading:true }),
  soil       : std({ color:0x2e241c, roughness:1.0 }),
  catFur     : std({ color:0xd08a4a, roughness:0.9 }),
  catLight   : std({ color:0xe8d9c4, roughness:0.9 }),
  teddy      : std({ color:0xc8a06a, roughness:1.0 }),
  glass      : phys({ color:0xd8ecf8, transparent:true, opacity:0.13, roughness:0.06, metalness:0.0, side:THREE.DoubleSide, envMapIntensity:1.4 }),
  frosted    : phys({ color:0xe6eef2, transparent:true, opacity:0.5, roughness:0.45, side:THREE.DoubleSide }),
  mirror     : std({ color:0xe8f2f8, roughness:0.05, metalness:1.0, envMapIntensity:1.6 }),
  curtain    : std({ color:0xf3efe6, transparent:true, opacity:0.6, side:THREE.DoubleSide, roughness:1.0 }),
  marble     : std({ color:0xe0ddd5, roughness:0.16, metalness:0.05, envMapIntensity:1.15 }),   // 云石
  slat       : std({ color:0x8a6440, roughness:0.55 }),                                        // 木條子
  wallPanel  : std({ color:0xf7f6f3, roughness:0.30 }),                                        // 白色飾牆
  panelLine  : std({ color:0xdcdad4, roughness:0.55 }),
  plank      : std({ color:0x5d4330, roughness:0.52 }),                                        // 深色木皮牆
  acShell    : std({ color:0xf2f1ec, roughness:0.34 }),
  acGrille   : std({ color:0xb9bfc5, roughness:0.45, metalness:0.35 }),
  screenOff  : std({ color:0x0a121c, roughness:0.25, metalness:0.4 }),
};

/* emissive materials that react to day/night — {mat, day, night} */
const dimmables = [];
function emissiveMat(color, day, night, base={}){
  const m = std(Object.assign({ color, emissive:color, emissiveIntensity:day, roughness:0.7 }, base));
  dimmables.push({ m, day, night });
  return m;
}
const M_glowWarm  = emissiveMat(0xffe2b8, 0.18, 1.30);   // downlight discs
const M_glowStrip = emissiveMat(0xffd9a0, 0.12, 0.95);   // cabinet / console strips
const M_glowCab   = emissiveMat(0xffe6c0, 0.15, 1.15);   // display cabinet LED
const M_glowBulb  = emissiveMat(0xffdba6, 0.0,  1.55);   // pendant bulb
const M_glowLamp  = emissiveMat(0xffdfae, 0.0,  1.05);   // sideboard lamp shade
const M_glowKitch = emissiveMat(0xffe0b0, 0.1,  1.0);    // kitchen strip
const M_glowBath  = emissiveMat(0xeef4ff, 0.08, 0.95);   // bathroom light
const M_cityWin   = new THREE.MeshBasicMaterial({ color:0xffcf8a, transparent:true, opacity:0.0, depthWrite:false });

/* ---------- light rig (day / night values are cross-faded) ---------- */
const hemi = new THREE.HemisphereLight(0xcfe5ff, 0x7a5c42, 0.5);
scene.add(hemi);
const amb = new THREE.AmbientLight(0xfff2e2, 0.12);
scene.add(amb);

const sun = new THREE.DirectionalLight(0xfff1dc, 3.1);
sun.position.set(-2.6, 6.8, 9.4);        // south, through the living-room window
sun.target.position.set(0.5, 0.0, -1.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -5.2; sun.shadow.camera.right = 5.2;
sun.shadow.camera.top = 5.2;   sun.shadow.camera.bottom = -5.2;
sun.shadow.camera.near = 0.5;  sun.shadow.camera.far = 30;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun); scene.add(sun.target);

/* dimmable lights registry */
const dimLights = [];
function dLight(light, day, night){ scene.add(light); dimLights.push({ light, day, night }); return light; }

/* interior lights — mostly for night mode */
const DL = [];
[[-1.35,-0.62],[-0.05,-0.62],[1.25,-0.62],[-1.35,0.62],[-0.05,0.62],[1.25,0.62]].forEach(([x,z])=>{
  const p = new THREE.PointLight(0xffd9a8, 0, 3.8, 2);
  p.position.set(x, H-0.09, z);
  dLight(p, 0.45, 1.9);
  DL.push(p);
});
const pendantLight = new THREE.PointLight(0xffcf9a, 0, 5.0, 2);
pendantLight.position.set(-1.25, 1.90, 0.05);
pendantLight.castShadow = true;
pendantLight.shadow.mapSize.set(1024,1024);
pendantLight.shadow.camera.near = 0.1; pendantLight.shadow.camera.far = 7;
pendantLight.shadow.bias = -0.004;
dLight(pendantLight, 0, 3.0);

const cabLight  = dLight(new THREE.PointLight(0xffe0b0, 0, 1.9, 2), 0.2, 0.9);   cabLight.position.set(-1.18, 1.80, Z0+0.34);
const kitLight  = dLight(new THREE.PointLight(0xffd9a8, 0, 6.0, 2), 0.3, 2.0);   kitLight.position.set(-1.75, 2.15, -2.1);
const bathLight = dLight(new THREE.PointLight(0xeef4ff, 0, 5.0, 2), 0.25, 1.4);  bathLight.position.set(1.75, 2.1, -2.0);
const lampLight = dLight(new THREE.PointLight(0xffd2a0, 0, 3.2, 2), 0, 1.1);     lampLight.position.set(-1.90, 1.05, 0.80);
const tvLight   = dLight(new THREE.PointLight(0x7fb2ff, 0, 3.0, 2), 0, 0.6);     tvLight.position.set(TVC, 1.30, Z0+0.60);

/* sky dome — procedural gradient shader */
const skyUni = {
  uTop: { value:new THREE.Color(0x6fa8dd) },
  uHor: { value:new THREE.Color(0xdfeaf2) },
  uBot: { value:new THREE.Color(0xc8d6e0) },
  uGlow:{ value:new THREE.Color(0xffe2b0) },
  uSunDir:{ value:new THREE.Vector3(0.12, 0.22, 1).normalize() },
  uGlowI:{ value:1.0 },
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(98, 32, 18),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite:false, fog:false,
    uniforms: skyUni,
    vertexShader:`varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader:`
      varying vec3 vDir;
      uniform vec3 uTop, uHor, uBot, uGlow; uniform vec3 uSunDir; uniform float uGlowI;
      void main(){
        float h = vDir.y;
        vec3 col = (h > 0.0) ? mix(uHor, uTop, pow(h, 0.62)) : mix(uHor, uBot, pow(-h, 0.5));
        float g = pow(max(dot(normalize(vDir), normalize(uSunDir)), 0.0), 7.0);
        col += uGlow * g * uGlowI;
        gl_FragColor = vec4(col, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`
  })
);
sky.frustumCulled = false;
scene.add(sky);

/* ---------- tiny helpers ---------- */
const V3 = (x,y,z)=> new THREE.Vector3(x,y,z);
function box(w,h,d,mat,x=0,y=0,z=0){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); return m;
}
function cyl(rt,rb,h,mat,x=0,y=0,z=0,seg=20){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat);
  m.position.set(x,y,z); return m;
}
function sphere(r,mat,x=0,y=0,z=0,seg=18){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r,seg,Math.max(8,seg-4)), mat);
  m.position.set(x,y,z); return m;
}
function roundedBox(w,h,d,r,mat){
  r = Math.max(0.004, Math.min(r, w/2-0.002, d/2-0.002));
  const bevel = Math.min(0.01, r*0.45, h*0.2);
  const s = new THREE.Shape();
  const hw = w/2, hd = d/2, ir = Math.max(0.002, r-bevel);
  s.moveTo(-hw+ir, -hd);
  s.lineTo(hw-ir, -hd);  s.absarc(hw-ir, -hd+ir, ir, -Math.PI/2, 0, false);
  s.lineTo(hw, hd-ir);   s.absarc(hw-ir, hd-ir, ir, 0, Math.PI/2, false);
  s.lineTo(-hw+ir, hd);  s.absarc(-hw+ir, hd-ir, ir, Math.PI/2, Math.PI, false);
  s.lineTo(-hw, -hd+ir); s.absarc(-hw+ir, -hd+ir, ir, Math.PI, Math.PI*1.5, false);
  const geo = new THREE.ExtrudeGeometry(s, {
    depth: Math.max(h-2*bevel, 0.002), bevelEnabled:true,
    bevelThickness:bevel, bevelSize:bevel, bevelSegments:2, curveSegments:5
  });
  geo.rotateX(-Math.PI/2); geo.center();
  return new THREE.Mesh(geo, mat);
}
function shadows(root, cast=true, recv=true){
  root.traverse(o=>{ if(o.isMesh){ o.castShadow=cast; o.receiveShadow=recv; } });
  return root;
}
const clamp = (v,a,b)=> Math.max(a, Math.min(b, v));

/* =====================================================================
   1 · SHELL — parquet floor, walls, ceiling, skirting, soffit
   ===================================================================== */
const shell = new THREE.Group(); scene.add(shell);

/* sub-floor + parquet */
shell.add(box(L+0.4, 0.014, D+0.4, std({color:0x3a2418, roughness:1}), 0, 0.007, 0));
{
  const plankW = 0.088, gap = 0.004, th = FL;
  const pitch = plankW + gap;
  const rows = Math.floor(D/pitch);
  const geo = new THREE.BoxGeometry(1, th, plankW);
  const mat = std({ color:0xffffff, roughness:0.6 });
  const items = [];
  for(let r=0; r<rows; r++){
    const z = Z0 + pitch/2 + r*pitch + (rnd()-0.5)*0.002;
    let x = X0 + (r%2)*0.31 + rnd()*0.06;
    while(x < X1){
      const len = clamp(rr(0.45,0.72), 0.1, X1-x);
      items.push({ x:x+len/2, z, len });
      x += len + gap;
    }
  }
  const inst = new THREE.InstancedMesh(geo, mat, items.length);
  const dummy = new THREE.Object3D(); const col = new THREE.Color();
  items.forEach((it,i)=>{
    dummy.position.set(it.x, th/2, it.z);
    dummy.scale.set(it.len, 1, 1);
    dummy.updateMatrix();
    inst.setMatrixAt(i, dummy.matrix);
    col.setHSL(0.062+rr(-0.008,0.01), rr(0.42,0.55), rr(0.30,0.40), THREE.SRGBColorSpace);
    inst.setColorAt(i, col);
  });
  inst.instanceMatrix.needsUpdate = true;
  if(inst.instanceColor) inst.instanceColor.needsUpdate = true;
  inst.receiveShadow = true;
  shell.add(inst);
}

  /* 電視 — wall mounted between the TV cabinet and the 冷氣窗 */
  const TV = new THREE.Group();
  TV.add(box(1.22, 0.72, 0.045, M.black, TVC, 1.34, Z0+0.052));
  const uni = { uTime:{ value:0 }, uOn:{ value:0 } };
  const scr = new THREE.Mesh(
    new THREE.PlaneGeometry(1.16, 0.64),
    new THREE.ShaderMaterial({
      uniforms: uni,
      vertexShader:`varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv; uniform float uTime, uOn;
        void main(){
          vec2 uv = vUv; float t = uTime*0.05;
          float a = sin(uv.x*3.1 + t*1.7) + sin(uv.y*2.7 - t*1.3) + sin((uv.x+uv.y)*2.2 + t);
          vec3 c1 = vec3(0.035,0.075,0.16);
          vec3 c2 = vec3(0.07,0.26,0.34);
          float w1 = 0.5+0.5*sin(a*1.3);

          col += vec3(0.75,0.45,0.18) * pow(max(0.0,sin(a*0.7 - t*0.6)), 3.0) * 0.30;

          gl_FragColor = vec4(col,1.0);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }`
    })
  );
  scr.position.set(TVC, 1.34, Z0+0.076);

  shadows(TV); furn.add(TV);
}

   7 · DAY / NIGHT mixer
   ===================================================================== */
const skyDay = { top:new THREE.Color(0x6fa8dd), hor:new THREE.Color(0xdfeaf2), bot:new THREE.Color(0xc8d6e0) };
const skyNight = { top:new THREE.Color(0x0a1224), hor:new THREE.Color(0x1a2336), bot:new THREE.Color(0x0e1526) };
const fogDay = new THREE.Color(0xdde8f0), fogNight = new THREE.Color(0x101a2c);
const hemiSkyDay = new THREE.Color(0xcfe5ff), hemiSkyNight = new THREE.Color(0x2a3550);
const hemiGndDay = new THREE.Color(0x7a5c42), hemiGndNight = new THREE.Color(0x201812);
const sunDay = new THREE.Color(0xfff1dc);

const state = { mix:0, target:0, night:false, lastApplied:-1 };
function setNight(on){
  state.night = on;
  state.target = on ? 1 : 0;
  const b = document.getElementById('btnNight');
  b.classList.toggle('on', on);
  b.textContent = on ? '☀️ 日光 Day' : '🌙 夜燈 Night';
}
document.getElementById('btnNight').addEventListener('click', ()=> setNight(!state.night));

const _c1 = new THREE.Color(), _c2 = new THREE.Color();
function applyMix(f){
  renderer.toneMappingExposure = 1.04 - f*0.06;
  scene.environmentIntensity = 0.34 - f*0.16;
  sun.intensity = 3.1 * (1-f);
  sun.color.copy(sunDay);
  hemi.intensity = 0.5 * (1-f) + 0.05 * f;
  hemi.color.lerpColors(hemiSkyDay, hemiSkyNight, f);
  hemi.groundColor.lerpColors(hemiGndDay, hemiGndNight, f);
  amb.intensity = 0.12 * (1-f) + 0.015 * f;

  dimLights.forEach(d=>{ d.light.intensity = d.day + (d.night - d.day)*f; });
  dimmables.forEach(d=>{ d.m.emissiveIntensity = d.day + (d.night - d.day)*f; });

  skyUni.uTop.value.lerpColors(skyDay.top, skyNight.top, f);
  skyUni.uHor.value.lerpColors(skyDay.hor, skyNight.hor, f);
  skyUni.uBot.value.lerpColors(skyDay.bot, skyNight.bot, f);
  skyUni.uGlowI.value = 1.0 - f*0.85;

  scene.fog.color.lerpColors(fogDay, fogNight, f);
  M_cityWin.opacity = 0.10 + f*0.85;
  dust.material.opacity = 0.42*(1-f) + 0.05*f;
  if(window.__cityDim) window.__cityDim.forEach(d=> d.m.color.lerpColors(d.day, d.night, f));
  if(window.__tvUniforms) window.__tvUniforms.uOn.value = f;
}

  camAnim.fromT.copy(controls.target); camAnim.toT.copy(p.t);
  camAnim.t = 0; camAnim.dur = dur; camAnim.active = true;
  document.querySelectorAll('[data-view]').forEach(b=> b.classList.toggle('on', b.dataset.view === name));
}
document.querySelectorAll('[data-view]').forEach(b=> b.addEventListener('click', ()=>{
  stopTour(); flyTo(b.dataset.view);
}));
controls.addEventListener('start', ()=>{ stopTour(); });

/* tour controls */
const btnTour = document.getElementById('btnTour');
function stopTour(){ if(tour.on){ tour.on = false; btnTour.classList.remove('on'); } }
btnTour.addEventListener('click', ()=>{
  tour.on = !tour.on;
  btnTour.classList.toggle('on', tour.on);
  if(tour.on){ tour.idx = 0; tour.timer = 0; flyTo(tourOrder[0], 1.6); }
});

/* spin */
const btnSpin = document.getElementById('btnSpin');
btnSpin.addEventListener('click', ()=>{
  controls.autoRotate = !controls.autoRotate;
  controls.autoRotateSpeed = 0.9;
  btnSpin.classList.toggle('on', controls.autoRotate);
});

/* keyboard */
window.addEventListener('keydown', e=>{
  const map = { '1':'entrance', '2':'sofa', '3':'dining', '4':'tv', '5':'top' };
  if(map[e.key]){ stopTour(); flyTo(map[e.key]); }
  if(e.key === 'n' || e.key === 'N') setNight(!state.night);
});

/* =====================================================================
   9 · RESIZE + MAIN LOOP
   ===================================================================== */
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();
let firstFrame = true;

function tick(){
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;

  /* day / night crossfade */
  const k = 1 - Math.exp(-dt * 2.4);
  state.mix += (state.target - state.mix) * k;
  if(Math.abs(state.mix - state.lastApplied) > 0.002){
    applyMix(state.mix); state.lastApplied = state.mix;
  }

  /* camera fly + guided tour */
  if(camAnim.active){
    camAnim.t += dt;
    const u = clamp(camAnim.t / camAnim.dur, 0, 1);
    const s = u*u*(3-2*u);
    camera.position.lerpVectors(camAnim.fromP, camAnim.toP, s);
    controls.target.lerpVectors(camAnim.fromT, camAnim.toT, s);
    if(u >= 1) camAnim.active = false;
  }
  if(tour.on){
    tour.timer += dt;
    if(tour.timer > 6.0){
      tour.timer = 0; tour.idx = (tour.idx+1) % tourOrder.length;
      flyTo(tourOrder[tour.idx], 2.2);
    }
  }
  controls.update();
  /* keep the orbit camera inside the room (no wall clipping) */
  camera.position.x = clamp(camera.position.x, X0+0.14, X1-0.14);
  camera.position.y = clamp(camera.position.y, 0.30, H-0.18);
  camera.position.z = clamp(camera.position.z, Z0+0.14, Z1-0.14);

  /* curtains breathing (main window is on the south wall) */
  for(const c of curtains){
    const pos = c.pos;
    for(let i=0;i<pos.count;i++){
      const x = c.baseX[i];
      pos.setZ(i, 0.022*Math.sin(x*13 + c.phase) + 0.010*Math.sin(x*5 + time*1.1 + c.phase));
    }
    pos.needsUpdate = true;
  }

  /* cat: slow breathing + tail sway */
  const b = 1 + 0.014*Math.sin(time*1.6);
  cat.scale.set(1, b, 1);
  cat.position.y = 0.36 + 0.004*Math.sin(time*1.6);

  /* dust drift */
  const dp = dust.geometry.attributes.position;
  for(let i=0;i<dustSeed.length;i++){
    let y = dp.getY(i) + dt*0.014;
    if(y > 2.4) y = 0.3;
    dp.setY(i, y);
    dp.setX(i, dp.getX(i) + Math.sin(time*0.25 + dustSeed[i])*dt*0.006);
  }
  dp.needsUpdate = true;

  /* TV shader time */
  if(window.__tvUniforms) window.__tvUniforms.uTime.value = time;

  renderer.render(scene, camera);

  if(firstFrame){
    firstFrame = false;
    /* hide the loader once a frame is on screen; rAF may be throttled in
       background tabs, so a timer fallback guarantees it disappears */
    const hideLoader = ()=>{
      document.getElementById('loader').classList.add('hide');
      window.__sceneReady = true;
    };
    requestAnimationFrame(hideLoader);
    setTimeout(hideLoader, 2500);
  }
  requestAnimationFrame(tick);
}

/* kick-off */
setNight(false);
applyMix(0);
tick();

/* dev hook — also handy for tinkering from the browser console:
   __room.snapTo('sofa'), __room.setNight(true), __room.renderer … */
window.__room = {
  THREE, scene, camera, controls, renderer, setNight, flyTo, presets: PRESETS, furn, shell,
  snapTo(name){
    const p = PRESETS[name]; if(!p) return;
    camAnim.active = false;
    camera.position.copy(p.p); controls.target.copy(p.t);
    controls.update(); renderer.render(scene, camera);
  },
  look(px,py,pz, tx,ty,tz){
    camAnim.active = false;
    camera.position.set(px,py,pz); controls.target.set(tx,ty,tz);
    controls.update(); renderer.render(scene, camera);
  },
  apply(mix){ state.mix = state.lastApplied = mix; applyMix(mix); renderer.render(scene, camera); },
  render(){ renderer.render(scene, camera); },
  /* grab a still of the current view (useful for sharing / debugging) */
  png(){ renderer.render(scene, camera); return renderer.domElement.toDataURL('image/jpeg', 0.85); },
};

</script>
</body>
</html>
